repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        exclude: ^tsconfig\.json$
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
        exclude: ^(static/sitemap\.xml|.*\.svg)$
      - id: trailing-whitespace
        exclude: \.svg$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^\.github/scripts/
      - id: ruff-format
        files: ^\.github/scripts/

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        files: ^src/.*\.(svelte|ts|js|css|json)$
      - id: svelte-check
        name: svelte-check
        entry: npm run check
        language: system
        files: ^(src/|svelte\.config\.js|vite\.config\.ts|tsconfig\.json)
        pass_filenames: false
